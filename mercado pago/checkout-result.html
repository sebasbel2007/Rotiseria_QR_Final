<!DOCTYPE html>
<!-- File: plataforma cursos SyM/pages/checkout/checkout-result.html -->
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resultado de pago — Cursos SyM</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
</head>
<body>
<div id="app-loader"><div class="loader-spinner"></div></div>

<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div class="card" style="max-width:480px;width:100%;text-align:center;padding:3rem 2rem;">
    <div id="result-icon" style="margin-bottom:1rem;display:inline-flex;"></div>
    <h2 id="result-title" style="margin-bottom:.75rem;">Procesando pago...</h2>
    <p id="result-msg" style="margin-bottom:2rem;"></p>
    <a id="result-btn" href="../../index.html" class="btn btn-primary" style="display:none;">Continuar</a>
  </div>
</main>

<script type="module">
  import { auth } from '../../firebase/firebase-config.js';
  import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { processMembershipPayment, processCoursePayment } from '../../assets/js/payments.js';
  import { getCourse } from '../../assets/js/db.js';

  const params   = new URLSearchParams(window.location.search);
  const type     = params.get('type');
  const status   = params.get('status');
  const paymentId = params.get('payment_id') || params.get('paymentId') || 'sandbox';

  const iconEl  = document.getElementById('result-icon');
  const titleEl = document.getElementById('result-title');
  const msgEl   = document.getElementById('result-msg');
  const btnEl   = document.getElementById('result-btn');
  const loader  = document.getElementById('app-loader');

  function showResult(icon, title, msg, btnText, btnHref) {
    iconEl.innerHTML = icon;
    titleEl.textContent = title;
    msgEl.textContent   = msg;
    btnEl.textContent   = btnText;
    btnEl.href          = btnHref;
    btnEl.style.display = 'inline-flex';
    loader?.classList.add('fade-out');
    setTimeout(() => loader?.remove(), 300);
  }

  if (status !== 'approved' && status !== 'pending') {
    showResult('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:var(--error);"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 9l-6 6M9 9l6 6"/></svg>', 'Pago no completado',
      'El pago fue rechazado o cancelado.',
      'Volver al inicio', '../../index.html');
  } else if (status === 'pending' && type !== 'membership') {
    showResult('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:var(--warning);"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>', 'Pago pendiente',
      'Tu pago está pendiente de acreditación. Te avisaremos cuando se confirme.',
      'Volver al inicio', '../../index.html');
  } else {
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showResult('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:var(--warning);"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>', 'Sesión expirada', 'Iniciá sesión para verificar tu pago.', 'Ingresar', '../auth/login.html');
        return;
      }

      try {
        if (type === 'membership') {
          // Guard: si ya es teacher no reprocesar
          const { getUserData, createUserDoc } = await import('../../assets/js/db.js');
          const userData = await getUserData(user.uid);
          if (!userData) {
            // Primer acceso post-pago: crear doc en Firestore
            const pending = JSON.parse(sessionStorage.getItem('sym-pending-teacher') || 'null');
            await createUserDoc(user.uid, {
              uid: user.uid,
              email: user.email,
              displayName: pending?.displayName || user.displayName || '',
              role: 'student',
              photoURL: null,
              membershipStatus: 'none',
              membershipPaidAt: null,
              suspended: false,
              suspendedReason: null
            });
            sessionStorage.removeItem('sym-pending-teacher');
          }
          const freshData = await getUserData(user.uid);
          if (freshData?.role !== 'teacher') {
            await processMembershipPayment(user.uid, paymentId);
          }
          showResult('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:var(--success);"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>', '¡Membresía activada!',
            'Ya sos Profesor en Cursos SyM. Podés crear y publicar tus cursos.',
            'Ir a mi panel', '../dashboard-teacher/index.html');

        } else if (type === 'course') {
          const courseId   = params.get('courseId');
          const teacherId  = params.get('teacherId');
          const price      = parseInt(params.get('price') || '0');
          const course     = await getCourse(courseId);
          const totalMods  = course?.totalModules || 1;

          await processCoursePayment(user.uid, courseId, teacherId, price, paymentId, totalMods);
          showResult('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:var(--success);"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>', '¡Compra exitosa!',
            `Ya podés acceder a "${course?.title || 'el curso'}".`,
            'Ir al curso', `../course/course-player.html?courseId=${courseId}`);

        } else {
          showResult('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:var(--warning);"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>', 'Tipo de pago desconocido', '', 'Volver al inicio', '../../index.html');
        }
      } catch (err) {
        console.error(err);
        showResult('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:var(--error);"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 9l-6 6M9 9l6 6"/></svg>', 'Error al procesar el pago',
          'El pago fue recibido pero hubo un error al actualizar tu cuenta. Contactá al soporte.',
          'Volver al inicio', '../../index.html');
      }
    });
  }
</script>
</body>
</html>
